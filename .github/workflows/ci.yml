name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Vite+ (`vp`) runs on Node.js ^22.18 || ^24.11.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install

      - name: Lockfile drift
        run: bun run lockfile:check

      - name: Versions in sync
        run: bun run version:check

      - name: Format, lint and type check
        run: bunx vp check

      - name: Pack (dry run)
        run: bun run publish:packages --dry-run
