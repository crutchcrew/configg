name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Lockfile drift
        run: bun run lockfile:check

      - name: Versions in sync
        run: bun run version:check

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Pack (dry run)
        run: bun run publish:packages --dry-run
