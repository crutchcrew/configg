pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: '*.{ts,tsx,js,jsx,json,md}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx,js,jsx}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: Lockfile drift check
      run: bun install --frozen-lockfile --dry-run
